# Personal laptop -- linked as ~/.config/mise/config.toml by `install.sh personal`.
# Standalone: nothing is shared with config.coreweave.toml.
[tools]
aws-cli = { version = "latest", symlink_bins = "true" }
claude-code = "latest"
codex = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
go = "latest"
helm = "latest"
herdr = "latest"
kubectl = "latest"
node = "lts"
python = "latest"
ripgrep = "latest"
rust = "latest"
uv = "latest"
zoxide = "latest"

[tools."http:android-platform-tools"]
version = "latest"
url = 'https://dl.google.com/android/repository/platform-tools_r{{ version }}-{{ os(macos="darwin", windows="win") }}.zip'
version_list_url = "https://dl.google.com/android/repository/repository2-3.xml"
version_regex = 'platform-tools_r(\d+\.\d+\.\d+)-'
version_order = "semver"
strip_components = 1
